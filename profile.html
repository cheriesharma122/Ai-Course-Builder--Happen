<!DOCTYPE html>
<html>
<head>
  <title>Create Roadmap</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>Create Your Learning Path</h1>

    <input id="skill" placeholder="Skill (AI, Web Development...)">

    <input id="level" placeholder="Level (Beginner/Intermediate)">

    <input id="goal" placeholder="Goal (Job/Freelance)">

    <input id="time" placeholder="Daily study time">

    <input id="language" placeholder="Language (English/Hindi)">

    <button onclick="generateRoadmap()">
      Generate Roadmap 🚀
    </button>

    <p><a href="settings.html">Settings</a></p>
  </div>

  <script src="profile.js"></script>
</body>
</html>
