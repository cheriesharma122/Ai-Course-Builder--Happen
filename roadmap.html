<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Your AI Roadmap</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="roadmap-page">

  <header class="roadmap-header">
    <div>
      <h1>AI SkillPath</h1>
      <p>Your personalized learning journey</p>
    </div>

    <div class="header-buttons">
      <button
        class="secondary-button"
        onclick="createNewRoadmap()"
      >
        Create New
      </button>

      <button
        class="primary-button"
        onclick="downloadRoadmap()"
      >
        Download PDF
      </button>
    </div>
  </header>

  <main class="roadmap-wrapper">

    <section
      id="roadmap"
      class="roadmap-container"
    >
      <div class="loading-box">
        <div class="spinner"></div>

        <h2>Creating your personalized roadmap...</h2>

        <p>
          Gemini is preparing topics, exercises,
          projects and learning resources.
        </p>
      </div>
    </section>

  </main>

  <script src="roadmap.js"></script>

</body>
</html>
